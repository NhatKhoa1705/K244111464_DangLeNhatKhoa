<html>
    <head>
        <title>Tiêu đề trang</title>
        <script src="js/mainjs.js"></script>
        <script type="text/javascript">
            function kiemTra(a)
            {
                anumber=eval(a)
                kq=isEven(anumber)
                if(kq==true)
                    alert(a+" Là Số chẵn")
                else
                    alert(a+" Là Số lẻ")
            }
        </script>
    </head>
    <body>
        <h1>Kiểm tra số chẵn hay lẻ</h1>
        <p>Nhập số đi, kiểm tra cho nè:</p>
        <input type="number" id="soa">
        <p></p>
        <input type="button" value="Kiểm tra chẵn lẻ" 
        onclick="kiemTra(soa.value)">
    </body>
</html>
